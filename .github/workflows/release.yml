name: release

# A tag beginning with v publishes a GitHub release with the signed APK attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Mapped at the job level so the step below can ask whether it is set: secrets themselves
      # cannot be read in an `if`.
      KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Say what is missing
        if: env.KEYSTORE == ''
        run: |
          echo "::error::Add RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD to the repository secrets (see RELEASING.md)."
          exit 1

      # The key never lives in the repository: it is put back from the repository secrets for this
      # one build. See RELEASING.md.
      - name: Put the signing key back
        env:
          PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=moonlight\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$PASSWORD" "$PASSWORD" > keystore.properties

      - name: Build the release
        run: bash ./gradlew :app:assembleRelease --console=plain

      - name: Check that it is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs "$APK"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The APK is given the name people will see in their downloads folder.
          cp app/build/outputs/apk/release/app-release.apk "MoonlightPages-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "MoonlightPages-${GITHUB_REF_NAME}.apk" \
            --title "Moonlight Pages $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
